[package]
name = "junk-libs-platen"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["backend-hayro"]
# Pure-Rust engine (hayro).
backend-hayro = ["dep:hayro"]
# PDFium engine via junk-libs-pdfium, mainly for A/B comparison.
backend-pdfium = ["dep:junk-libs-pdfium"]

[[example]]
name = "ab_compare"
required-features = ["backend-hayro", "backend-pdfium"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
unicode-segmentation = "1.13"
thiserror.workspace = true
image = "0.25"
log.workspace = true
lopdf.workspace = true
hayro = { version = "0.7.1", optional = true, features = ["embed-fonts"] }
junk-libs-pdfium = { workspace = true, optional = true }
