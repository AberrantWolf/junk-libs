[package]
name = "junk-libs-pdfium"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
image = "0.25"
# The pdfium_NNNN feature must match PDFIUM_VERSION in build.rs.
pdfium-render = { version = "0.9.1", default-features = false, features = [
    "pdfium_7763",
    "image_025",
    "thread_safe",
] }

[build-dependencies]
ureq = "3"
flate2 = "1"
tar = "0.4"
