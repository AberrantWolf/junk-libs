[workspace]
resolver = "2"
members = [
    "junk-libs-core",
    "junk-libs-accuraterip",
    "junk-libs-disc",
    "junk-libs-disc-id",
    "junk-libs-dat",
    "junk-libs-pdfium",
    "junk-libs-platen",
    "junk-libs-raster",
    "junk-libs-egui-docview",
    "junk-libs-egui-pdfdoc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
junk-libs-core = { path = "junk-libs-core" }
junk-libs-accuraterip = { path = "junk-libs-accuraterip" }
junk-libs-disc = { path = "junk-libs-disc" }
junk-libs-disc-id = { path = "junk-libs-disc-id" }
junk-libs-dat = { path = "junk-libs-dat" }
junk-libs-pdfium = { path = "junk-libs-pdfium" }
junk-libs-platen = { path = "junk-libs-platen" }
junk-libs-raster = { path = "junk-libs-raster" }
junk-libs-egui-docview = { path = "junk-libs-egui-docview" }
junk-libs-egui-pdfdoc = { path = "junk-libs-egui-pdfdoc" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
egui = "0.34"
image = "0.25"
crc32fast = "1.4"
sha1 = "0.10"
md5 = "0.7"
base64 = "0.22"
chd = "0.3"
log = { version = "0.4", features = ["std"] }
quick-xml = "0.37"
lopdf = { version = "0.40", default-features = false }
tempfile = "3"
