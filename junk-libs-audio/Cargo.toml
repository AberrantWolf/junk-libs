[package]
name = "junk-libs-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
decode-wav = ["dep:symphonia"]
disc-readers = ["dep:junk-libs-disc"]

[dependencies]
junk-libs-core.workspace = true
junk-libs-disc = { workspace = true, optional = true }
