[package]
name = "junk-libs-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
derivative-validation = ["dep:claxon", "dep:junk-libs-disc"]
decode-wav = ["dep:symphonia"]
decode-compressed = ["dep:symphonia", "symphonia/all", "dep:symphonia-metadata", "dep:symphonia-bundle-mp3"]
# Ogg Opus through bundled libopus (C build); separate so other consumers avoid it.
decode-opus = ["dep:symphonia", "symphonia/ogg", "dep:symphonia-adapter-libopus"]
disc-readers = ["dep:junk-libs-disc"]
resample = ["dep:rubato"]

[dependencies]
claxon = { version = "0.4.3", optional = true }
junk-libs-disc = { workspace = true, optional = true }
thiserror.workspace = true
serde.workspace = true
symphonia = { version = "0.5.5", default-features = false, features = ["pcm", "wav"], optional = true }
symphonia-metadata = { version = "0.5.5", optional = true }
rubato = { version = "0.16.2", optional = true }
# Matches trash-amp so libopus is built once.
symphonia-adapter-libopus = { version = "0.2", optional = true }


# Symphonia PR #528 backport; see vendor provenance.
symphonia-bundle-mp3 = { path = "../vendor/symphonia-bundle-mp3", optional = true }

[dev-dependencies]
tempfile.workspace = true
# Same libopus build as the adapter 0.2.x resolved here; tests encode their own Ogg Opus fixtures.
opusic-sys = "0.7.3"
