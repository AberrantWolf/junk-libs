[package]
name = "junk-libs-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
derivative-validation = ["dep:claxon", "dep:junk-libs-disc"]
decode-wav = ["dep:symphonia"]
decode-compressed = ["dep:symphonia", "symphonia/all"]
disc-readers = ["dep:junk-libs-disc"]
resample = ["dep:rubato"]

[dependencies]
claxon = { version = "0.4.3", optional = true }
junk-libs-disc = { workspace = true, optional = true }
thiserror.workspace = true
symphonia = { version = "0.5.5", default-features = false, features = ["pcm", "wav"], optional = true }
rubato = { version = "0.16.2", optional = true }

[dev-dependencies]
tempfile.workspace = true
